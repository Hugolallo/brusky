[project]
name = "brusky"
version = "0.1.0"
description = "Standalone, driver-based dependency security monitor (composer / npm / Docker)"
requires-python = ">=3.12"

dependencies = [
    # HTTP client — OSV.dev advisory queries + changelog fetching
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    # Config + validation
    "pyyaml>=6.0.2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    # Logging
    "structlog>=24.2.0",
    # Optional fix-guidance layer — LLM abstraction (unified API for 100+ providers).
    # Detection works with this absent; only the changelog→fix narrative needs it.
    "litellm>=1.52.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "ipython>=8.0.0",
]

[project.scripts]
brusky = "brusky.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brusky"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
