[project]
name = "brusky"
version = "0.1.0"
description = "Defense agent for detecting security vulnerabilities in PHP/Laravel/Redis/Vue 2/Nuxt 2 stacks"
requires-python = ">=3.12"

dependencies = [
    # LLM abstraction — unified API for 100+ providers (OpenAI, Anthropic, Ollama, Groq, …)
    "litellm>=1.52.0",
    # Graph memory — Neo4j driver (async-capable)
    "neo4j>=5.19.0",
    # Blackboard state — Redis
    "redis>=5.0.0",
    # Config + validation
    "pyyaml>=6.0.2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    # Agent orchestration
    "langgraph>=0.2.28",
    "langchain-core>=0.3.0",
    # HTTP (for webhook outputs, future API)
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    # Logging
    "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "ipython>=8.0.0",
]

[project.scripts]
brusky = "brusky.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brusky"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
