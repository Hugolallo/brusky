services:

  # ── Graph memory — Neo4j (Phase 01 World Model + Phase 05 Regression Detector) ──
  neo4j:
    image: neo4j:5.19-community
    container_name: brusky-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser UI
      - "7687:7687"   # Bolt protocol (driver connection)
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Blackboard state — Redis (Phase 02 Analysis shared state) ──
  redis:
    image: redis:7.2-alpine
    container_name: brusky-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Brusky agent service ──
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: brusky-agent
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Infrastructure
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      # Model provider — overridden by config/models.yaml, these are fallbacks
      LLM_PROVIDER: "${LLM_PROVIDER:-anthropic}"
      LLM_MODEL: "${LLM_MODEL:-claude-sonnet-4-6}"
      # API keys (pass only the key for your chosen provider)
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      # Ollama — use this when running a local model
      OLLAMA_API_BASE: "${OLLAMA_API_BASE:-}"
      # Bitbucket integration
      BITBUCKET_WEBHOOK_SECRET: "${BITBUCKET_WEBHOOK_SECRET:-}"
      BITBUCKET_ACCESS_TOKEN: "${BITBUCKET_ACCESS_TOKEN:-}"
      BITBUCKET_WORKSPACE: "${BITBUCKET_WORKSPACE:-}"
      # Output channels
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
      PAGERDUTY_API_KEY: "${PAGERDUTY_API_KEY:-}"
    volumes:
      - ./config:/app/config:ro
      - ./.claude/commands:/app/.claude/commands:ro   # skill prompts
      - ./src:/app/src:ro          # hot-reload in dev
      - scan_output:/app/output
    ports:
      - "8080:8080"               # agent HTTP API (future)
    profiles:
      - agent                     # `docker compose --profile agent up` to include

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
  scan_output:
