# ── Brusky — model configuration ──────────────────────────────────────────────
# The only LLM use in Brusky is the optional M3 explainer + fix-guidance layer
# (`fix_guidance.advisor`). Detection is deterministic and needs no model.
# This file is read only when that layer runs; with no provider configured the
# report renders exactly the same.
#
# Resolution order for an agent's config (highest priority first):
#   1. this file → <phase>.<agent>      (e.g. fix_guidance.advisor)
#   2. this file → default
#   3. env vars LLM_PROVIDER / LLM_MODEL
#
# Supported providers (via LiteLLM):
#   anthropic  → claude-sonnet-4-6 | claude-opus-4-6 | claude-haiku-4-5-20251001
#   openai     → gpt-4o | gpt-4o-mini
#   ollama     → qwen2.5-coder:32b | mistral-small (local, no API key)
#   azure      → azure/<your-deployment-name>
# ──────────────────────────────────────────────────────────────────────────────

# Fallback for any agent without a specific override below.
default:
  provider: anthropic
  model: claude-sonnet-4-6
  temperature: 0.1
  max_tokens: 4096

# ── M3: explainer + fix guidance ───────────────────────────────────────────────
# `advisor` turns (advisory + real changelog + real call sites) into a structured
# explainer and upgrade guidance. A grounded summarize-and-format task, well
# within a 14B+ local coder model.
#
# Running locally on Ollama. num_ctx must be large enough to fit the changelog
# (Ollama's default is small and truncates the prompt silently); format: json
# forces valid structured output. Set OLLAMA_API_BASE in your environment.
fix_guidance:
  advisor:
    provider: ollama
    model: qwen2.5-coder:32b
    temperature: 0.1
    max_tokens: 1500
    num_ctx: 8192
    format: json

# ── Retry / resilience ─────────────────────────────────────────────────────────
retry:
  max_attempts: 3
  wait_seconds: 2
